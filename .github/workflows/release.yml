name: Release

# Daily + manual: pin submodule to latest upstream umurmur release, build esp32,
# publish a flashable zip via softprops/action-gh-release.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Pin submodule to latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/umurmur/umurmur/releases \
            --jq '[.[] | select(.prerelease==false and .draft==false)][0].tag_name')
          test -n "$TAG"
          echo "Upstream release: $TAG"
          git -C third_party/umurmur fetch --tags origin
          git -C third_party/umurmur checkout "$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/umurmur
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump umurmur to ${TAG}"
            git push
          fi

      - name: Patches + version
        id: ver
        run: |
          set -euo pipefail
          ./scripts/apply-umurmur-patches.sh
          echo "version=$(./scripts/umurmur-version.sh version)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version already released
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Already released $TAG — skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build esp32
        if: steps.skip.outputs.skip != 'true'
        run: >
          docker run --rm
          -v "$PWD:/project" -w /project -e HOME=/tmp
          espressif/idf:v5.5
          bash -lc 'idf.py set-target esp32 && idf.py build'

      - name: Pack flashable zip
        if: steps.skip.outputs.skip != 'true'
        id: pack
        run: |
          set -euo pipefail
          ZIP="umurmur-esp-${{ steps.ver.outputs.version }}.zip"
          ( cd build && zip "../${ZIP}" \
              bootloader/bootloader.bin \
              partition_table/partition-table.bin \
              umurmur-esp.bin \
              flash_args \
              flasher_args.json )
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        if: steps.skip.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body: |
            - Runtime version: `${{ steps.ver.outputs.version }}`
            - Target: `esp32`
            - IDF image: `espressif/idf:v5.5`

            Unzip and flash with esptool using `flash_args` (or see README).
          files: ${{ steps.pack.outputs.zip }}
