name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Version
        id: ver
        run: echo "version=$(./scripts/umurmur-version.sh version)" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Already released $TAG — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build esp32
        if: steps.skip.outputs.skip != 'true'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/project" -w /project \
            espressif/idf:v5.5 \
            bash -lc 'idf.py set-target esp32 && idf.py build'

      - name: Pack flashable zip
        if: steps.skip.outputs.skip != 'true'
        id: pack
        run: |
          set -euo pipefail
          ZIP="umurmur-esp-${{ steps.ver.outputs.version }}.zip"
          ( cd build && zip "../${ZIP}" \
              bootloader/bootloader.bin \
              partition_table/partition-table.bin \
              umurmur-esp.bin \
              flash_args \
              flasher_args.json )
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        if: steps.skip.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body: |
            - Runtime version: `${{ steps.ver.outputs.version }}`
            - Target: `esp32`
            - IDF image: `espressif/idf:v5.5`

          files: ${{ steps.pack.outputs.zip }}
